<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPU Report Tool</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1 id="mainTitle">AAPU Performance Dashboard</h1>
        <p>Upload your <pre>Daily Dp1 All Geo.xlsx</pre> file to see performance.</p>
    </header>

    <div class="upload-container">
        <input type="file" id="fileUploader" accept=".xlsx, .xls" />
    </div>

    <div id="allResultsContainer">
        
        <div class="list-container" id="criticalContainer">
            <h2>Critical ⚠️</h2>
            <div id="criticalList" class="country-list-wrapper">
                <p class="placeholder">Upload a file to begin analysis...</p>
            </div>
        </div>
        
        <div class="list-container" id="belowBenchmarkContainer">
            <h2>Below Benchmark</h2>
            <div id="belowList" class="country-list-wrapper">
                <p class="placeholder">Upload a file to begin analysis...</p>
            </div>
        </div>
        
        <div class="list-container" id="aboveBenchmarkContainer">
            <h2>Above Benchmark</h2>
            <div id="aboveList" class="country-list-wrapper">
                <p class="placeholder">Upload a file to begin analysis...</p>
            </div>
        </div>

    </div>

    <div id="reportModal" class="modal-hidden">
        <div class="modal-content">
            <button id="closeModalButton">&times;</button>
            <div id="reportContent">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
